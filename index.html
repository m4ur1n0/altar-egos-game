<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIAS</title>
<style>
*{box-sizing:border-box}
html{background:#ffd3e6;min-height:100%}
body{margin:0;color:#4a0d2e;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg img{position:absolute;opacity:.22;filter:drop-shadow(0 10px 18px rgba(120,0,60,.25))}
#bg .a{height:62vh;left:-2vw;bottom:-2vh;transform:rotate(-5deg)}
#bg .b{height:50vh;right:-1vw;top:6vh;transform:rotate(6deg)}
#bg .c{height:74vh;right:-4vw;bottom:-6vh;transform:rotate(-3deg)}
#bg .d{width:44vw;left:26vw;top:-3vh;transform:rotate(3deg)}
@media(min-width:900px){#bg img{opacity:.95}}
.w{max-width:960px;margin:14px auto;padding:18px 22px;background:rgba(255,211,230,.86);border-radius:30px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;font-size:20px;letter-spacing:.02em}
#timer{background:#fff;color:#d6176f;border-radius:99px;padding:3px 14px;font-size:14px;text-transform:lowercase}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{background:#ffb8d8;color:#6b0f3f;padding:7px 16px;font-size:14px;text-transform:lowercase}
nav button.on{background:#ff3d9a;color:#fff}
button{font:inherit;font-weight:700;background:#ff3d9a;color:#fff;border:0;border-radius:99px;padding:9px 18px;cursor:pointer}
button:active{transform:scale(.97)}
button.o{background:#ffb8d8;color:#6b0f3f}button.on2{background:#ff3d9a;color:#fff}button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:#4a0d2e;background:#fff;border:0;border-radius:16px;padding:10px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:3px solid #ff8cc3}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 4px;color:#a3125c}
h2{font-size:22px;margin:0 0 6px;text-transform:lowercase}
.box{padding:8px 0 14px;margin-bottom:10px}
.m{color:#9c3f6c;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;background:#ff3d9a;color:#fff;font-weight:700}
.it{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.feed{background:rgba(255,255,255,.55);border-radius:22px;height:320px;overflow-y:auto;padding:10px;margin-bottom:8px}
.fm{margin:6px 0}.pd{color:#9c3f6c;font-style:italic}
canvas{width:100%;border-radius:20px;touch-action:none;display:block;margin-bottom:8px;cursor:crosshair;background:#fff}
.big{font-size:22px;font-weight:700}.big0{font-size:38px;font-weight:700;color:#d6176f}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff}
#msgs{height:230px}
.msg{display:flex;gap:6px;margin:8px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.msg .av{width:28px;height:28px;font-size:12px}
.bw{max-width:80%}.msg.me .bw{text-align:right}.nm{font-size:11px;color:#9c3f6c;margin:0 10px 2px}
.bub{display:inline-block;text-align:left;padding:8px 14px;background:#fff;border-radius:20px;word-break:break-word;white-space:pre-wrap}
.msg.me .bub{background:#ff3d9a;color:#fff;border-bottom-right-radius:5px}.msg:not(.me) .bub{border-bottom-left-radius:5px}
.bub.dm{background:#e5ccff;color:#3b1466}.msg.me .bub.dm{background:#9b5de5;color:#fff}.bub.pd2{opacity:.45}.st{font-size:11px;color:#9c3f6c;margin:2px 10px}
#ci,#pi{border-radius:99px;padding:10px 16px}
@media(min-width:900px){#L{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}#p-chat{position:sticky;top:10px}#msgs{height:calc(100vh - 230px);min-height:260px}}
#card{position:fixed;inset:0;background:#ffd3e6;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:32px}
#card[hidden]{display:none}
#card .t{font-size:46px;font-weight:700;line-height:1.1;color:#d6176f;text-transform:lowercase}
#card .s{font-size:18px;margin:6px 0 20px;text-transform:lowercase}
#card li{margin:8px 0;font-size:16px}
</style></head>
<body><div id="bg"><img class="a" src="bg-wizard.webp" alt=""><img class="b" src="bg-robot.webp" alt=""><img class="c" src="bg-horse.webp" alt=""><img class="d" src="bg-lion.webp" alt=""></div>
<div class="w">
<header><span>alias</span><span id="timer"></span></header>
<nav id="nav" hidden></nav>
<div id="L"><div id="main">
<div id="p-game"><div id="stage"><div class="box m">connecting...</div></div><div id="host"></div></div>
<div id="p-prof" hidden></div>
<div id="p-notes" hidden class="box"><h2>Notebook</h2><div class="m">Private notes. Only you can see them.</div><textarea id="nb" style="min-height:300px;margin-top:8px" placeholder="Who is who? Observations? Anything."></textarea></div>
</div>
<div id="p-chat" hidden class="box">
 <h2>Chat</h2>
 <div class="m" style="margin-bottom:6px">Messages to everyone arrive after a random delay (up to 30s), in the order you sent them. Direct messages are immediate.</div>
 <div id="msgs" class="feed"></div>
 <div class="row"><select id="to" style="max-width:42%"></select><input id="ci" maxlength="500" placeholder="Message"><button onclick="send('main')">Send</button></div>
</div>
</div>
<div id="card" hidden></div>

</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const shuf=(a,salt)=>[...a].sort((x,y)=>hash(salt+x)-hash(salt+y));
const ROUNDS=['q','d','q','d'];
const QP=['Describe your typical outfit.','Which character would you want to be close friends with, and why?','What’s your dream job, and why?','Tell us a secret you’ve never told anyone.','What would you get {P} as a gift, and why?','Who is your character most attracted to, and why?','How does your character solve interpersonal conflicts at work?'];
const DP=['Draw your favorite memory.','Draw your typical outfit.','Draw a gift for {P}.','Draw your character’s worst day.'];
const CARD=8000;
const DUR={create:240,meet:120,joke:120,act:120,review:120,vote:120,score:60,perf:180,perfvote:20};
const LBL={joke:'FIRST TASK',act:'TASK',review:'REVIEW',vote:'VOTE',score:'RESULTS',perf:'PERFORMANCE',perfvote:'THUMBS',lobby:'LOBBY',create:'CREATE',meet:'MEET',end:'FINAL'};
let db,uid,S={phase:'lobby',gen:0,round:0,t0:0},P={},X={},ld={s:0,p:0},sig='',rejoin=false,adv='',pend=[],tab='game',pv=null,myG={},boonUI={},boonKey='',lastSec=0,auto='',lastAt={},seq=0;

// ---------- connection (shared key-value store on the party server) ----------
(()=>{
 const sp=new URLSearchParams(location.search);let id=(sp.get('u')||'').replace(/[^\w-]/g,'');
 try{id=id||localStorage.getItem('ae_uid');if(!id){id='p'+Math.random().toString(36).slice(2,10);localStorage.setItem('ae_uid',id)}}catch(e){id=id||'p'+Math.random().toString(36).slice(2,10)}
 uid=id;const cid=Math.random().toString(36).slice(2),lis=[];let cache={},loaded=false;
 const snap=p=>({id:p.split('/').pop(),exists:p in cache,data:()=>cache[p]});
 const fire=p=>lis.forEach(l=>l(p));
 const post=(path,data)=>fetch('/set',{method:'POST',body:JSON.stringify({path,data,by:cid})}).catch(()=>{});
 const doc=path=>({set:async d=>{cache[path]=d;fire(path);await post(path,d)},
  onSnapshot:cb=>{lis.push(p=>{if(p===null||p===path)cb(snap(path))});if(loaded)cb(snap(path))}});
 const col=path=>({add:async d=>{const i=Math.random().toString(36).slice(2)+Date.now().toString(36);await doc(path+'/'+i).set(d)},
  onSnapshot:cb=>{const mk=()=>({docs:Object.keys(cache).filter(k=>k.startsWith(path+'/')&&k.indexOf('/',path.length+1)<0).map(snap)});
   lis.push(p=>{if(p===null||p.startsWith(path+'/'))cb(mk())});if(loaded)cb(mk())}});
 db={doc,collection:col};
 db.doc('game/state').onSnapshot(s=>{S=s.exists?s.data():{phase:'lobby',gen:0,round:0,t0:0};ld.s=1;onData()});
 db.collection('players').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());ld.p=1;onData()});
 ['subs','likes','votes','pvotes','boons','notes','msgs'].forEach(n=>db.collection(n).onSnapshot(s=>{X[n]=s.docs.map(d=>({id:d.id,...d.data()}));n==='msgs'?updChat():onData()}));
 const es=new EventSource('/events');
 es.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='init'){cache=m.docs;loaded=true;fire(null)}else if(m.by!==cid){cache[m.path]=m.data;fire(m.path)}};
 es.onerror=()=>{if(!loaded)$('#stage').innerHTML='<div class="box">can’t reach the game server. is it running?</div>'};
 setInterval(tick,500);
})();

// ---------- helpers ----------
const g=n=>(X[n]||[]).filter(d=>d.gen===S.gen);
const act=()=>Object.entries(P).filter(([i,p])=>p.gen===S.gen).map(([id,p])=>({id,...p})).sort((a,b)=>a.joined-b.joined||(a.id<b.id?-1:1));
const mine=()=>P[uid]&&P[uid].gen===S.gen?P[uid]:null;
const isHost=()=>(act()[0]||{}).id===uid;
const cn=id=>P[id]&&P[id].char?P[id].char.name:'Someone';
const ids=()=>act().map(p=>p.id).sort((a,b)=>hash(S.gen+a)-hash(S.gen+b));
const performer=r=>{const l=ids();return l[r%l.length]};
const assign=(pid,r)=>{const l=ids(),n=l.length;if(n<2)return null;return l[(l.indexOf(pid)+1+(r%(n-1)))%n]};
const subOf=(k,pid)=>g('subs').find(d=>d.key===k&&d.from===pid);
const curKey=()=>S.phase==='joke'?'joke':'r'+S.round;
function save(patch){const cur={...(P[uid]||{}),...patch};P[uid]=cur;return db.doc('players/'+uid).set(cur)}
const setState=n=>db.doc('game/state').set(n);
function av(id){const c=P[id]&&P[id].char;if(c&&c.pic)return `<img class="av" src="${c.pic}" alt="">`;return `<div class="av">${esc((c&&c.name||'?')[0]).toUpperCase()}</div>`}
function card(id){const c=(P[id]||{}).char||{};return `<div class="it" style="border:0;padding:0">${av(id)}<div><b>${esc(c.name)}</b> <span class="m">${esc(c.pro)}${c.age?' / '+esc(c.age):''}</span><br><span class="m">${esc(c.occ)}${c.occ&&c.loc?' / ':''}${esc(c.loc)}</span></div></div>${c.bio?`<p style="margin:6px 0 0">${esc(c.bio)}</p>`:''}`}
function promptFor(r){
 const kind=ROUNDS[r],qn=ROUNDS.filter(k=>k==='q').length,ql=shuf(QP,'q'+S.gen);
 const list=kind==='q'?ql:shuf(DP.filter((d,i)=>i!==1||!ql.slice(0,qn).includes(QP[0])),'d'+S.gen);
 const t=list[ROUNDS.slice(0,r).filter(k=>k===kind).length%list.length],a=assign(uid,r);
 return t.replace('{P}',a?cn(a):'another character');
}

// ---------- scoring ----------
function tally(pid,r){
 const all=r===undefined,ok=d=>all||d.r===r;
 const L=g('likes').filter(d=>ok(d)&&d.items.includes(pid)).length,F=g('likes').filter(d=>ok(d)&&d.fav===pid).length;
 let by=0,hit=0,perf=0,take=0;
 g('votes').filter(ok).forEach(v=>{if(v.from===pid)hit+=Object.entries(v.guesses).filter(([t,x])=>x===t).length;else if(v.guesses[pid]===pid)by++});
 g('boons').filter(ok).forEach(b=>{
    if(b.kind==='take'){if(b.from===pid)take++;if(b.target===pid)take--}});
 if(all)ROUNDS.forEach((k,rr)=>{if(performer(rr)!==pid)return;const v=g('pvotes').filter(d=>d.r===rr);if(v.length&&v.filter(d=>d.up).length>v.length/2)perf++});
 return {L,F,by,hit,perf,take,t:L+F-by+2*hit+perf+take};
}
function total(pid){
 let t=tally(pid).t;
 if(S.phase==='end'){const v=g('pvotes').filter(d=>d.from===pid);if(v.length&&v.filter(d=>!d.up).length/v.length>.75)t-=5}
 return t;
}
function winners(r){const c={};act().forEach(p=>c[p.id]=(x=>x.L+x.F)(tally(p.id,r)));const mx=Math.max(0,...Object.values(c));return mx?Object.keys(c).filter(k=>c[k]===mx):[]}

// ---------- game flow ----------
function onData(){
 if(!ld.s||!ld.p)return;
 const m=P[uid];
 if(m&&m.gen!==S.gen){if(!rejoin){rejoin=true;save({gen:S.gen,joined:Date.now(),char:null})}}else rejoin=false;
 if(isHost()){
  if((S.phase==='joke'||S.phase==='act')&&act().every(p=>subOf(curKey(),p.id)))next();
  if(S.phase==='perfvote'&&act().filter(p=>p.id!==performer(S.round)).every(p=>g('pvotes').some(d=>d.r===S.round&&d.from===p.id)))next();
 }
 const s=[S.phase,S.gen,S.round,!!mine(),S.phase==='review'?g('subs').filter(d=>d.key==='r'+S.round).length:0].join();
 if(s!==sig){sig=s;view()}
 upd();
}
function next(){
 const key=[S.gen,S.phase,S.round].join();if(adv===key)return;adv=key;
 const n={...S,t0:Date.now()},o=['joke','act','review','vote','score','perf','perfvote'];
 if(S.phase==='create')n.phase='meet';
 else if(S.phase==='meet')n.phase='joke';
 else if(S.phase==='joke'){n.phase='act';n.round=0}
 else if(S.phase==='perfvote'){if(S.round<ROUNDS.length-1){n.round++;n.phase='act'}else n.phase='end'}
 else n.phase=o[o.indexOf(S.phase)+1];
 if(['joke','act','perf'].includes(n.phase))n.t0=Date.now()+CARD;
 setState(n);
}
function go(c){
 if(c==='start')setState({...S,phase:'create',t0:Date.now()});
 if(c==='begin')setState({...S,phase:'meet',t0:Date.now()});
 if(c==='skip'){adv='';next()}
 if(c==='new')setState({phase:'lobby',gen:S.gen+1,round:0,t0:0});
}
const CT={joke:['FIRST TASK','STAND UP',['Write three stand up jokes from your character’s perspective.','You have 2 minutes.','Your jokes are saved. Later, one character at a time takes the stage.']],
 q:['ROUND','QUESTION ROUND',['Everyone answers the same prompt.','2 minutes. No word limit.','Next you read everyone’s answers and like the ones you like. Each like is a point for that character.','Then you vote on who is behind each character.']],
 d:['ROUND','DRAWING ROUND',['Everyone draws the same prompt.','2 minutes. Use any colors you like.','Next you see everyone’s drawings, like the ones you like, and pick one overall favorite.','Then you vote on who is behind each character.']],
 perf:['PERFORMANCE','ON STAGE',['One character’s jokes are on stage.','Comment and engage for 3 minutes. Messages arrive after a 10 second delay.','Then everyone gives a secret thumbs up or thumbs down. A majority of thumbs up earns the performer a point.']]};
function showCard(){
 const c=$('#card');let k=null;
 if(mine()&&Date.now()<S.t0&&(S.phase==='joke'||S.phase==='act'||S.phase==='perf'))k=S.phase==='act'?ROUNDS[S.round]:S.phase;
 if(!k){if(!c.hidden)c.hidden=true;return}
 const key=S.gen+k+S.round;
 if(c.dataset.k!==key){c.dataset.k=key;const [t,sub,rules]=CT[k];
  c.innerHTML=`<div class="t">${k==='q'||k==='d'?t+' '+(S.round+1)+' OF '+ROUNDS.length:t+(k==='perf'?' '+(S.round+1):'')}</div><div class="s">${sub}${k==='perf'?' / '+esc(cn(performer(S.round))).toUpperCase():''}</div><ul>${rules.map(r=>`<li>${r}</li>`).join('')}</ul><div id="cd" class="big" style="margin-top:20px"></div>`}
 c.hidden=false;$('#cd').textContent='starts in '+Math.max(0,Math.ceil((S.t0-Date.now())/1000));
}
function tick(){
 flush();showCard();
 const T=$('#timer'),d=DUR[S.phase];
 if(!d){T.textContent=LBL[S.phase]||'';return}
 const el=(Date.now()-S.t0)/1000,left=Math.max(0,Math.ceil(d-el));
 T.textContent=el<0?'starting':LBL[S.phase]+'  '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left===0&&(S.phase==='joke'||S.phase==='act')){const k=S.gen+curKey();if(auto!==k&&!subOf(curKey(),uid)){auto=k;lock(true)}}
 if(left===0&&S.phase==='create'){const k=S.gen+'c';if(auto!==k){auto=k;autoChar()}}
 if(left===0&&isHost()&&el>=d+(S.phase==='joke'||S.phase==='act'||S.phase==='create'?3:0))next();
 const sec=Math.floor(Date.now()/1000);if(sec!==lastSec){lastSec=sec;updChat()}
}
function autoChar(){
 if(!mine()||!$('#cn'))return;
 const v=i=>($(i)||{value:''}).value.trim(),o=mine().char||{};
 save({char:{name:v('#cn')||o.name||'Nameless',pro:v('#cp')||o.pro||'',age:v('#ca')||o.age||'',loc:v('#cl')||o.loc||'',occ:v('#co')||o.occ||'',bio:v('#cb')||o.bio||'',pic:o.pic||''}});
}

// ---------- views ----------
function nav(){
 const on=['meet','joke','act','review','vote','score','perf','perfvote','end'].includes(S.phase)&&mine();
 const n=$('#nav');n.hidden=!on;$('#p-chat').hidden=!on;
 if(on&&!n.innerHTML)n.innerHTML=['game','prof','notes'].map(t=>`<button data-t="${t}" onclick="tabTo('${t}')">${{game:'GAME',prof:'PROFILES',notes:'NOTES'}[t]}</button>`).join('');
 if(!on)tab='game';
 tabTo(tab);
}
function tabTo(t){
 tab=t;if(t!=='prof')pv=null;
 ['game','prof','notes'].forEach(x=>{$('#p-'+x).hidden=x!==t});
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='prof')renderProf();
}
function view(){
 nav();
 const st=$('#stage'),m=mine(),ph=S.phase;
 if(!m){
  st.innerHTML=ph==='lobby'?`<div class="box"><h2>Join</h2><div class="m">Make up a character, chat as them, then guess who’s who. Keep it chaotic.</div><label>Your real name</label><input id="rn" maxlength="20" value="${esc((P[uid]&&P[uid].real)||'')}"><br><br><button onclick="join()">Join</button><div id="roster" style="margin-top:12px"></div></div>`:`<div class="box">this game already started, sorry!</div>`;return;
 }
 if(ph==='lobby')st.innerHTML=`<div class="box"><h2>Lobby</h2><div class="m">waiting on everybody to show up...</div><div id="roster"></div></div>`;
 else if(ph==='create'){const c=m.char||{},f=(i,l,k,n)=>`<label>${l}</label><input id="${i}" maxlength="${n}" value="${esc(c[k])}">`;
  st.innerHTML=`<div class="box"><h2>Create your character</h2><div class="m">this is all anyone else gets to see about you.</div>${f('cn','Name','name',30)}${f('cp','Pronouns','pro',20)}${f('ca','Age','age',10)}${f('cl','Location','loc',40)}${f('co','Occupation','occ',40)}<label>Bio</label><textarea id="cb" maxlength="400">${esc(c.bio)}</textarea><label>Profile picture</label><input type="file" id="cpic" accept="image/*"><br><br><button onclick="saveChar()">Save character</button> <span id="cok" class="m"></span></div><div class="box"><h2>Ready</h2><div id="roster"></div></div>`}
 else if(ph==='meet')st.innerHTML=`<div class="box"><div class="m">before the first task</div><h2>Meet the characters</h2><div class="m">Read everyone’s profile. You have 2 minutes. Profiles stay in the PROFILES tab all game.</div>${act().filter(p=>p.char).map(p=>`<div style="margin-top:20px">${card(p.id)}${p.id===uid?'<div class="m">(you)</div>':''}</div>`).join('')}</div>`;
 else if(ph==='joke')st.innerHTML=`<div class="box"><h2>First task</h2><p>Write three stand up jokes from the perspective of your character. You have 2 minutes. They are saved for later.</p>${[1,2,3].map(i=>`<label>Joke ${i}</label><textarea class="jk"></textarea>`).join('')}<br><button id="lock" onclick="lock()">Submit</button> <span class="m" id="cnt"></span></div>`;
 else if(ph==='act'){const d=ROUNDS[S.round]==='d';
  st.innerHTML=`<div class="box"><div class="m">round ${S.round+1} / ${d?'drawing':'question'}</div><h2>${esc(promptFor(S.round))}</h2>${d?`<canvas id="cv" width="500" height="375"></canvas><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${['#000000','#e11d48','#f97316','#facc15','#16a34a','#2563eb','#7c3aed','#92400e'].map(c=>`<button class="sw" style="background:${c}" onclick="setC('${c}')"></button>`).join('')}</div><div class="row" style="margin-bottom:8px"><button class="o" onclick="pen(3)">Thin</button><button class="o" onclick="pen(9)">Thick</button><button class="o" onclick="pen(-1)">Erase</button><button class="o" onclick="clr()">Clear</button></div>`:'<textarea id="ta" style="min-height:160px" placeholder="No word limit."></textarea><br><br>'}<button id="lock" onclick="lock()">Submit</button> <span class="m" id="cnt"></span></div>`;
  if(d)initCanvas()}
 else if(ph==='review'){const k='r'+S.round;
  st.innerHTML=`<div class="box"><div class="m">round ${S.round+1}</div><h2>Review the material</h2><div class="m">Like what you like. Likes are secret and you can’t like your own.</div>${ROUNDS[S.round]==='d'?'<div class="m"><b>Drawing round:</b> also pick ONE favorite drawing. A favorite is worth an extra point.</div>':''}${act().filter(p=>p.id!==uid).sort((a,b)=>hash(S.gen+k+a.id)-hash(S.gen+k+b.id)).map(p=>{const s=subOf(k,p.id);return `<div class="it">${av(p.id)}<div style="flex:1;min-width:0"><b>${esc(cn(p.id))}</b><br>${s?(s.kind==='draw'?`<img src="${s.data}" style="width:100%;border-radius:18px">`:esc(s.data).replace(/\n/g,'<br>')):'<span class="m">(no answer)</span>'}</div>${s?`<div style="display:flex;flex-direction:column;gap:6px"><button class="o" data-a="${p.id}" onclick="like('${p.id}')">Like</button>${ROUNDS[S.round]==='d'?`<button class="o" data-f="${p.id}" onclick="setFav('${p.id}')">Favorite</button>`:''}</div>`:''}</div>`}).join('')}</div>`}
 else if(ph==='vote'){myG={...((g('votes').find(d=>d.r===S.round&&d.from===uid)||{}).guesses||{})};const hs=act().filter(x=>x.id!==uid);
  st.innerHTML=`<div class="box"><div class="m">round ${S.round+1}</div><h2>Who is who?</h2><div class="m">Guess who is behind each character. Change your mind any time before the timer ends.</div>${hs.map(p=>`<div class="it" style="flex-wrap:wrap">${av(p.id)}<div style="flex:1;min-width:0"><b>${esc(cn(p.id))}</b><br><span class="m">${esc(p.char.occ)} / ${esc(p.char.loc)}</span></div><select style="width:44%" onchange="gs('${p.id}',this.value)"><option value="">?</option>${hs.map(x=>`<option value="${x.id}"${myG[p.id]===x.id?' selected':''}>${esc(x.real)}</option>`).join('')}</select><div style="flex-basis:100%">${mat('r'+S.round,p.id)}</div></div>`).join('')||'<div class="m">No one else is playing.</div>'}</div>`}
 else if(ph==='score'){const t=tally(uid,S.round);
  st.innerHTML=`<div class="box"><div class="m">round ${S.round+1} results</div><h2>Your points</h2><div class="big0">${t.t>=0?'+':''}${t.t}</div><div>Likes received: +${t.L}<br>${ROUNDS[S.round]==='d'?`Favorite votes: +${t.F}<br>`:''}People who guessed you: -${t.by}<br>Your correct guesses: +${t.hit*2}</div></div><div id="boon"></div>`;boonKey=''}
 else if(ph==='perf'){const p=performer(S.round),j=(subOf('joke',p)||{}).data||[];
  st.innerHTML=`<div class="box"><h2>Performance</h2><div class="m">now performing</div><div class="it" style="border:0;padding:0 0 8px">${av(p)}<b style="align-self:center">${esc(cn(p))}</b></div><ol>${j.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="m">(they wrote nothing)</li>'}</ol></div><div class="box"><div class="m" style="margin-bottom:6px">Comment and engage. Messages arrive after a 10 second delay.</div><div id="pf" class="feed"></div><div class="row"><input id="pi" maxlength="500" placeholder="Comment"><button onclick="send('perf')">Send</button></div></div>`;updChat()}
 else if(ph==='perfvote'){const p=performer(S.round);
  st.innerHTML=p===uid?`<div class="box"><h2>The audience is voting</h2><div class="m">Your performance is being judged.</div></div>`:`<div class="box"><h2>Rate the performance</h2><div class="m">Votes are secret. Final answer when the timer ends.</div><div class="row" style="margin-top:10px"><button id="up" onclick="pvote(true)">Thumbs up</button><button id="dn" class="o" onclick="pvote(false)">Thumbs down</button></div></div>`}
 else if(ph==='end'){const l=act().map(p=>({p,t:total(p.id)})).sort((a,b)=>b.t-a.t);
  st.innerHTML=`<div class="box"><h2>Final scores</h2>${l.map((x,i)=>`<div class="it"><div class="big" style="width:40px">${i+1}</div><div style="flex:1"><b>${esc(x.p.real)}</b></div><div class="big">${x.t}</div></div>`).join('')}<div class="m" style="margin-top:8px">No characters were revealed.</div></div>`}
}
const mat=(k,pid)=>{const s=subOf(k,pid);return s?(s.kind==='draw'?`<img src="${s.data}" style="width:100%;border-radius:18px">`:esc(s.data).replace(/\n/g,'<br>')):'<span class="m">(no answer)</span>'};
function join(){const n=$('#rn').value.trim();if(!n)return;save({gen:S.gen,joined:Date.now(),real:n,char:null})}
function pic(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,120,120);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res('');i.src=r.result};r.readAsDataURL(f)})}
async function saveChar(){
 const v=i=>$(i).value.trim(),f=$('#cpic').files[0],old=mine().char;
 if(!v('#cn')){$('#cok').textContent='Name your character first.';return}
 await save({char:{name:v('#cn'),pro:v('#cp'),age:v('#ca'),loc:v('#cl'),occ:v('#co'),bio:v('#cb'),pic:f?await pic(f):(old&&old.pic)||''}});
 $('#cok').textContent='Saved.';
}
function initCanvas(){
 const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineCap=x.lineJoin='round';x.lineWidth=3;x.strokeStyle='#000';let d=false;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()};
 c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
 c.onpointerup=c.onpointercancel=()=>{d=false};
 let col='#000',w=3,er=false;const ap=()=>{x.strokeStyle=er?'#fff':col;x.lineWidth=er?22:w};
 window.setC=c=>{col=c;er=false;ap()};window.pen=v=>{if(v<0)er=true;else{er=false;w=v}ap()};
 window.clr=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)};
}
const sub=(key,kind,data)=>db.doc(`subs/${S.gen}_${key}_${uid}`).set({gen:S.gen,key,from:uid,kind,data});
function lock(force){
 if(subOf(curKey(),uid))return;
 if(S.phase==='joke'){const j=[...document.querySelectorAll('.jk')].map(x=>x.value.trim());if(force&&!j.some(Boolean))return;sub('joke','jokes',j)}
 else if(S.phase==='act'){
  if(ROUNDS[S.round]==='d'){const c=$('#cv');if(c)sub('r'+S.round,'draw',c.toDataURL('image/jpeg',.7))}
  else{const t=$('#ta');if(t&&(t.value.trim()||!force))sub('r'+S.round,'text',t.value.trim())}}
}
const myL=()=>g('likes').find(d=>d.r===S.round&&d.from===uid)||{items:[],fav:null};
function like(a){const c=myL();db.doc(`likes/${S.gen}_${S.round}_${uid}`).set({gen:S.gen,r:S.round,from:uid,items:c.items.includes(a)?c.items.filter(x=>x!==a):[...c.items,a],fav:c.fav||null})}
function setFav(a){const c=myL();db.doc(`likes/${S.gen}_${S.round}_${uid}`).set({gen:S.gen,r:S.round,from:uid,items:c.items,fav:c.fav===a?null:a})}
function gs(t,v){if(v)myG[t]=v;else delete myG[t];db.doc(`votes/${S.gen}_${S.round}_${uid}`).set({gen:S.gen,r:S.round,from:uid,guesses:{...myG}})}
function pvote(up){db.doc(`pvotes/${S.gen}_${S.round}_${uid}`).set({gen:S.gen,r:S.round,from:uid,up});$('#up').className=up?'':'o';$('#dn').className=up?'o':''}

// ---------- boons ----------
const BOONS={guess:'Make a guess about someone’s identity (confirmed or denied, no points)',notes:'See someone else’s notebook',likers:'See who liked your submission',top:'See the top three on the leaderboard',take:'Take a point from another player'};
function renderBoon(){
 const el=$('#boon');if(!el)return;
 const w=winners(S.round),b=g('boons').find(d=>d.r===S.round&&d.from===uid),others=act().filter(p=>p.id!==uid);
 const key=[!!b,boonUI.k,w.includes(uid)].join();if(key===boonKey)return;boonKey=key;
 if(!w.includes(uid)){el.innerHTML='';return}
 const sel=id=>`<select id="${id}">${others.map(p=>`<option value="${p.id}">${esc(cn(p.id))}</option>`).join('')}</select>`;
 if(b){let r='';
  if(b.kind==='guess')r=b.guess===b.target?'CONFIRMED. That character is them.':'DENIED. That character is not them.';
  if(b.kind==='notes'){const n=g('notes').find(d=>d.id===b.target);r=`Notebook of ${esc(cn(b.target))}:<br><br>${n&&n.text?esc(n.text).replace(/\n/g,'<br>'):'(empty)'}`}
  if(b.kind==='likers'){const l=g('likes').filter(d=>d.r===S.round&&(d.items.includes(uid)||d.fav===uid)).map(d=>cn(d.from));r=l.length?'Liked by: '+l.map(esc).join(', '):'No one.'}
  if(b.kind==='top')r=act().map(p=>({p,t:total(p.id)})).sort((x,y)=>y.t-x.t).slice(0,3).map((x,i)=>`${i+1}. ${esc(x.p.real)} (${x.t})`).join('<br>');
  if(b.kind==='take')r=`You took a point from ${esc(cn(b.target))}.`;
  el.innerHTML=`<div class="box"><h2>Your boon</h2><div class="m">${esc(BOONS[b.kind])}</div><p>${r}</p></div>`;return}
 const k=boonUI.k;
 el.innerHTML=`<div class="box"><h2>You earned a boon</h2><div class="m">You got the most likes. Pick one.</div><div style="margin-top:8px">${Object.entries(BOONS).map(([x,l])=>`<button class="${k===x?'':'o'}" style="display:block;width:100%;text-align:left;margin-bottom:6px" onclick="boonUI.k='${x}';renderBoon()">${esc(l)}</button>`).join('')}</div>${k?`<div>${k==='guess'?`<label>Which character</label>${sel('bt')}<label>Who is it</label><select id="bg">${others.map(p=>`<option value="${p.id}">${esc(p.real)}</option>`).join('')}</select>`:''}${k==='notes'||k==='take'?`<label>Which character</label>${sel('bt')}`:''}<br><button onclick="pickBoon()">Confirm</button></div>`:''}</div>`;
}
function pickBoon(){
 const k=boonUI.k;if(!k)return;
 const t=$('#bt')?$('#bt').value:null,gu=$('#bg')?$('#bg').value:null;
 db.doc(`boons/${S.gen}_${S.round}_${uid}`).set({gen:S.gen,r:S.round,from:uid,kind:k,target:t,guess:gu});boonUI={};
}

// ---------- profiles, notes, chat ----------
function renderProf(){
 const p=$('#p-prof');
 if(pv&&P[pv]&&P[pv].char){p.innerHTML=`<div class="box">${card(pv)}${P[pv].char.pic?`<br><img src="${P[pv].char.pic}" style="width:160px;border-radius:18px">`:''}<br><br><button class="o" onclick="pv=null;renderProf()">Back</button></div>`;return}
 p.innerHTML=`<div class="box"><h2>Profiles</h2><div class="m">Tap a character to see their info.</div>${act().filter(x=>x.char).map(x=>`<div class="it" style="cursor:pointer" onclick="pv='${x.id}';renderProf()">${av(x.id)}<div><b>${esc(x.char.name)}</b>${x.id===uid?' <span class="m">(you)</span>':''}<br><span class="m">${esc(x.char.occ)}</span></div></div>`).join('')}</div>`;
}
let nt;$('#nb').addEventListener('input',()=>{clearTimeout(nt);nt=setTimeout(()=>db.doc('notes/'+uid).set({gen:S.gen,text:$('#nb').value}),500)});
function send(kind){
 const inp=$(kind==='main'?'#ci':'#pi'),t=inp.value.trim();if(!t)return;inp.value='';
 const to=kind==='main'?$('#to').value:'all',now=Date.now();
 const ch=kind==='main'?'main':'p'+S.round;let at=now+(to!=='all'?0:kind==='main'?Math.random()*30000:10000);
 if(to==='all'){at=Math.max(at,(lastAt[ch]||0)+400);lastAt[ch]=at}
 pend.push({gen:S.gen,ch,from:uid,to,text:t.slice(0,500),at,ct:now});
 flush();updChat();
}
function flush(){const now=Date.now();pend=pend.filter(p=>{if(p.at>now)return true;const{at,ct,...m}=p;m.t=now+(seq++)/1000;db.collection('msgs').add(m);return false})}
function feed(el,ch){
 if(!el)return;
 const now=Date.now(),vis=m=>m.gen===S.gen&&m.ch===ch&&(m.to==='all'||m.from===uid||m.to===uid);
 const l=[...(X.msgs||[]).filter(vis),...pend.filter(p=>p.ch===ch&&p.gen===S.gen).map(p=>({...p,t:p.ct,pend:Math.ceil((p.at-now)/1000)}))].sort((a,b)=>a.t-b.t);
 const h=l.map(m=>{const me=m.from===uid,dm=m.to!=='all';
  const nm=(me?'You':esc(cn(m.from)))+(dm?' · direct'+(m.to===uid?' to you':' to '+esc(cn(m.to))):'');
  return `<div class="msg${me?' me':''}">${me?'':av(m.from)}<div class="bw"><div class="nm">${nm}</div><div class="bub${dm?' dm':''}${m.pend>0?' pd2':''}">${esc(m.text)}</div>${m.pend>0?`<div class="st">sends in ${m.pend}s</div>`:''}</div></div>`}).join('')||'<div class="m">No messages yet.</div>';
 if(el.dataset.h===h)return;el.dataset.h=h;
 const near=el.scrollHeight-el.scrollTop-el.clientHeight<60;el.innerHTML=h;if(near||!el.dataset.s){el.scrollTop=el.scrollHeight;el.dataset.s=1}
}
function updChat(){
 if(!ld.s||!ld.p)return;
 const to=$('#to'),o='<option value="all">Everyone (delayed)</option>'+act().filter(p=>p.id!==uid&&p.char).map(p=>`<option value="${p.id}">Direct: ${esc(p.char.name)}</option>`).join('');
 if(to.dataset.h!==o){const v=to.value;to.dataset.h=o;to.innerHTML=o;if([...to.options].some(x=>x.value===v))to.value=v}
 feed($('#msgs'),'main');
 if(S.phase==='perf')feed($('#pf'),'p'+S.round);
}
function upd(){
 if(!ld.s||!ld.p)return;
 const ps=act(),r=$('#roster');
 if(r)r.innerHTML=ps.map(p=>`<div class="it" style="padding:4px 0;border:0"><b style="flex:1">${esc(p.real)}</b><span class="m">${S.phase==='create'?(p.char?'ready':'writing...'):''}</span></div>`).join('');
 const l=$('#lock');
 if(l){const done=!!subOf(curKey(),uid);l.disabled=done;l.textContent=done?'Submitted':'Submit';document.querySelectorAll('.jk,#ta').forEach(e=>{e.disabled=done});const cv=$('#cv');if(cv)cv.style.pointerEvents=done?'none':'';
  $('#cnt').textContent=ps.filter(p=>subOf(curKey(),p.id)).length+'/'+ps.length+' locked in'}
 const li=(g('likes').find(d=>d.r===S.round&&d.from===uid)||{items:[]}).items;
 document.querySelectorAll('[data-a]').forEach(b=>{const on=li.includes(b.dataset.a);b.textContent=on?'Liked':'Like';b.className=on?'on2':'o'});
 const fv=myL().fav;document.querySelectorAll('[data-f]').forEach(b=>{const on=fv===b.dataset.f;b.textContent=on?'Favorite *':'Favorite';b.className=on?'on2':'o'});
 if(S.phase==='score')renderBoon();
 if(tab==='prof')renderProf();
 updChat();
 let h='';
 if(isHost()){
  const rd=ps.filter(p=>p.char).length;
  if(S.phase==='lobby')h=`<button ${ps.length<1?'disabled':''} onclick="go('start')">Start (${ps.length} joined)</button>`;
  else if(S.phase==='create')h=`<button ${rd<ps.length?'disabled':''} onclick="go('begin')">Begin game (${rd}/${ps.length} ready)</button>`;
  else if(S.phase==='end')h=`<button onclick="go('new')">New game</button>`;
  else h=`<button class="o" onclick="go('skip')">Skip ahead</button>`;
 }
 const H=$('#host');if(H.dataset.h!==h){H.dataset.h=h;H.innerHTML=h}
}
</script></body></html>
